# Run from a dedicated deployment directory. Copy .env.example to .env and pin
# SNOWLUMA_IMAGE to a verified official tag/digest. Do not commit private data.
services:
  snowluma:
    image: ${SNOWLUMA_IMAGE:-motricseven7/snowluma:v2.2.1}
    container_name: dsh-snowluma
    entrypoint: ["/bin/bash", "/opt/dsh/start-snowluma.sh"]
    restart: unless-stopped
    shm_size: 1gb
    mem_limit: 1800m
    ulimits:
      nofile:
        soft: 65536
        hard: 1048576
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp=unconfined
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TZ: Asia/Shanghai
      SNOWLUMA_UID: ${SNOWLUMA_UID:-1000}
      SNOWLUMA_GID: ${SNOWLUMA_GID:-1000}
      SNOWLUMA_WEBUI_HOST: 0.0.0.0
      SNOWLUMA_WEBUI_PORT: 5099
      SNOWLUMA_HOOK_AUTOLOAD: "1"
      SNOWLUMA_QQ_FLAGS: ${SNOWLUMA_QQ_FLAGS:---disable-gpu --disable-software-rasterizer --disable-gpu-compositing}
    ports:
      - "0.0.0.0:${SNOWLUMA_NOVNC_PORT:-6081}:6081"
      - "0.0.0.0:${SNOWLUMA_WEBUI_PORT:-5099}:5099"
    volumes:
      - ./start-snowluma.sh:/opt/dsh/start-snowluma.sh:ro
      - ./data:/app/data
      - ./qq-config:/app/.config
      - ./qq-share:/app/.local/share
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
